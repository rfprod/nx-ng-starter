version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '04:00'
    cooldown:
      default-days: 7
    groups:
      all-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    open-pull-requests-limit: 1
    labels:
      - 'CI/CD'
      - 'Dependencies'
      - 'Maintenance'
  - package-ecosystem: 'docker'
    directory: '/.docker'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '04:00'
    cooldown:
      default-days: 7
    groups:
      all-containers:
        patterns:
          - '*'
    commit-message:
      prefix: 'build'
      include: 'scope'
    open-pull-requests-limit: 1
    labels:
      - 'DevOps'
      - 'Dependencies'
      - 'Maintenance'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '04:00'
    cooldown:
      default-days: 7
    groups:
      all-containers:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
    commit-message:
      prefix: 'build'
      include: 'scope'
    open-pull-requests-limit: 0
    labels:
      - 'Dependencies'
      - 'Maintenance'
